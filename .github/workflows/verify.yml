name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: rust ${{ matrix.toolchain }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test --all-targets

      - name: Doc tests
        run: cargo test --doc

      - name: Example compiles
        run: cargo build --example typed_feed

  conformance:
    name: live conformance (three-node Riverbed)
    runs-on: ubuntu-latest
    # Only runs when the conformance Riverbed is provisioned via
    # repository variables; skips cleanly otherwise.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Conformance suite (skipped without endpoints)
        if: vars.WHITEWATER_CONFORMANCE_URLS != ''
        run: cargo test --all-targets -- --ignored
        env:
          WHITEWATER_CONFORMANCE_URLS: ${{ vars.WHITEWATER_CONFORMANCE_URLS }}
          WHITEWATER_FIXTURE_DIR: ${{ vars.WHITEWATER_FIXTURE_DIR }}
          WHITEWATER_API_KEY: ${{ vars.WHITEWATER_API_KEY }}
